<template id="team-profile-prince"><article class="team-profile-full"><div class="team-dialog-media"><img src="assets/team/prince-ansah.webp" alt="Dr. Prince Ansah"></div><div class="team-dialog-copy"><p class="team-role">Country Engagement Lead · CDKN Ghana</p><h2 id="team-dialog-title">Dr. Prince Ansah</h2><p>Dr. Prince Ansah is a climate change and sustainable development expert with extensive experience advancing climate-resilient development across Africa. He holds a PhD in Environmental and Geographical Science from the University of Cape Town, an MPhil in Climate Change and Sustainable Development, and a BA in Geography and Resource Development from the University of Ghana.</p><p>He has served as a Postdoctoral Fellow at the African Climate and Development Initiative, Guest Lecturer at Wageningen Centre for Development Innovation, and Technical Expert at the Institute for Environment and Sanitation Studies, contributing to major projects across Africa.</p></div></article></template>
<template id="team-profile-valerie"><article class="team-profile-full"><div class="team-dialog-media"><img src="assets/team/valerie-nutakor.webp" alt="Valerie Nutakor"></div><div class="team-dialog-copy"><p class="team-role">Country Programme Coordinator · CDKN Ghana</p><h2 id="team-dialog-title">Valerie Nutakor</h2><p>Valerie Nutakor is a climate change and sustainable development professional with experience in research, advocacy, policy and programme management.</p><p>She holds an MA in Development Studies from ISSER and a BA in Geography and Resource Development from the University of Ghana. Her research examines the socio-economic dimensions of adaptation in Ghana’s coastal regions, including community vulnerability to shoreline retreat in Keta and lessons from the Dansoman Emergency Sea Defence Project.</p></div></article></template>
<template id="team-profile-sarfoh"><article class="team-profile-full"><div class="team-dialog-media"><img src="assets/team/sarfoh-danquah.webp" alt="Sarfoh Danquah"></div><div class="team-dialog-copy"><p class="team-role">Operations Lead</p><h2 id="team-dialog-title">Sarfoh Danquah</h2><p>Sarfoh Danquah is a climate policy advocate with half a decade of experience in climate resilience, youth engagement and evidence-based policy development. He was among the lead researchers developing Ghana’s National Youth Climate Adaptation Strategy, a component of the National Adaptation Plan and the world’s first national youth climate adaptation strategy.</p><p>His work spans urban mobility, youth leadership, agroecology and community adaptation. He has trained more than 360 young leaders and equipped over 3,100 children with practical climate and environmental knowledge. At BTS, he oversees finance systems, statutory compliance, human resources, information systems, procurement and coordination across projects.</p></div></article></template>
<template id="team-profile-bismark"><article class="team-profile-full"><div class="team-dialog-media"><img src="assets/team/bismark-amponsah.webp" alt="Bismark Tabi Amponsah"></div><div class="team-dialog-copy"><p class="team-role">Project Manager</p><h2 id="team-dialog-title">Bismark Tabi Amponsah</h2><p>Bismark Tabi Amponsah is an accounting and finance professional, researcher and data analyst with an interdisciplinary background spanning accounting, finance, economics, management and sociology. He holds an MSc in Accounting and Finance from KNUST and a bachelor’s degree in Economics from the University of Cape Coast.</p><p>His experience includes financial management, accounting, data analysis, research, public-health administration, inventory management and programme support across public, private and development settings.</p></div></article></template>
<template id="team-profile-veronica"><article class="team-profile-full"><div class="team-dialog-media"><img src="assets/team/veronica-ofori.webp" alt="Veronica K. Ofori"></div><div class="team-dialog-copy"><p class="team-role">Project Manager</p><h2 id="team-dialog-title">Veronica K. Ofori</h2><p>Veronica K. Ofori is a climate and sustainable development professional with an MPhil in Climate Change and Sustainable Development from the University of Ghana and a BSc in Agriculture from KNUST.</p><p>She supports climate adaptation and resilience through research, programme design and implementation, stakeholder engagement, capacity building and knowledge development. Her work translates research and policy priorities into practical programmes and evidence products for decision-makers.</p></div></article></template>
<template id="team-profile-lois"><article class="team-profile-full"><div class="team-dialog-media"><img src="assets/team/lois-tay.webp" alt="Lois Mawuena Tay"></div><div class="team-dialog-copy"><p class="team-role">Communications Lead</p><h2 id="team-dialog-title">Lois Mawuena Tay</h2><p>Lois Mawuena Tay is a communications professional with experience in strategic communications, media relations, content development and stakeholder engagement. She studied Media and Communication at KNUST, specialising in public relations, and has worked across media, corporate and sustainable-development settings.</p><p>Through storytelling and other communication approaches, she makes evidence more accessible, relevant and useful to the people and communities it seeks to serve.</p></div></article></template>
<template id="team-profile-martha"><article class="team-profile-full"><div class="team-dialog-media"><img src="assets/team/martha-boakye.webp" alt="Martha Serwaa Boakye"></div><div class="team-dialog-copy"><p class="team-role">Media Officer</p><h2 id="team-dialog-title">Martha Serwaa Boakye</h2><p>Martha Serwaa Boakye is a journalist trained at the University of Media, Arts and Communication. Skilled in creative storytelling and media communication, she brings important knowledge, ideas and conversations closer to people.</p><p>She tells stories that matter and uses her voice to build understanding, awareness and positive change.</p></div></article></template>
