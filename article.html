<main class="article-shell"><a class="text-link" href="blog.html" style="margin:0 0 42px">Back to all stories</a><p class="kicker" data-article-category>Climate</p><h1 data-article-title>What Heat Stole From Us</h1><p class="article-meta" data-article-meta>June 2026 · Accra, Ghana</p><img class="article-image" data-article-image src="assets/img/story-401.webp" alt=""><article class="article-body" data-article-body></article></main>
<div data-site-footer></div>
<script src="assets/site.js"></script><script>
const stories={
heat:{category:'Climate & society',title:'What Heat Stole From Us',meta:'June 2026 · Accra, Ghana',image:'assets/img/story-401.webp',alt:'Illustration on extreme heat in Accra',body:[`The heat does not arrive as a headline. It enters bedrooms that no longer cool at night, classrooms where concentration becomes difficult, markets where food spoils faster and farms where familiar seasons begin to shift.`, `In Ghana, rising temperatures are not a distant projection. They are shaping the everyday choices people make about work, health, food and rest. The burden is not shared evenly: people with fewer resources have fewer ways to adapt.`, `Climate justice asks us to see this clearly. Evidence must inform public systems, but it must also remain connected to the experiences behind the numbers. That is where better action begins.`]},
nature:{category:'Climate adaptation',title:'Building Youth Leadership on Nature-Based Solutions',meta:'18 April 2023 · Accra, Ghana',image:'assets/img/story-heat.webp',alt:'Young people discussing climate research',body:[`Nature-based solutions can strengthen resilience while protecting the ecosystems communities depend on. Their promise, however, rests on people who can shape, explain and sustain them locally.`, `BTS convened young climate leaders for practical learning on ecosystem-based approaches, connecting scientific concepts with lived environmental challenges.`, `The work centred not only on technical knowledge, but on agency: the confidence to build partnerships, communicate evidence and turn local ideas into credible action.`]},
voices:{category:'Policy',title:'Strengthening Youth Voices in Climate Policy',meta:'7 May 2024 · Tamale, Ghana',image:'assets/img/story-policy.webp',alt:'Youth climate policy workshop',body:[`Young people are often invited into climate conversations after the agenda has already been set. Meaningful participation starts earlier—with the knowledge and tools to engage policy on equal terms.`, `This regional capacity-building work introduced practical approaches to climate governance, evidence-based advocacy and constructive engagement with decision-makers.`, `The goal was direct: help youth voices move from the edges of consultation into the substance of climate policy.`]},
mel:{category:'Innovation',title:'Co-Creating Youth MEL Systems',meta:'12 June 2024 · Legon, Accra',image:'assets/img/story-mel.webp',alt:'Participants co-creating a monitoring framework',body:[`Impact frameworks are strongest when the people using them help shape them. BTS and the University of Ghana brought young climate actors into the design of practical monitoring, evaluation and learning tools.`, `The co-creation process focused on measures that are rigorous enough for institutions and usable enough for teams working in real programme settings.`, `The result is a clearer route from activity to learning—and from learning to better decisions.`]},
grassroots:{category:'Youth',title:'Strengthening Grassroots Climate Action',meta:'25 July 2025 · Accra, Ghana',image:'assets/img/story-grassroots.webp',alt:'Climate activists taking part in group work',body:[`Grassroots climate leaders bring local knowledge, trust and urgency to the work. What they often need is not another idea, but the structure and technical support to carry a promising idea further.`, `BTS worked with climate activists to sharpen programme concepts, strengthen delivery thinking and build more sustainable pathways for community-rooted initiatives.`, `When local leadership is treated as expertise, climate action becomes more relevant—and more likely to last.`]},
cop:{category:'Youth',title:'Preparing Youth Voices for Global Climate Dialogue',meta:'3 September 2025 · Accra, Ghana',image:'assets/img/story-cop.webp',alt:'Young climate advocates in a pre-COP session',body:[`Global climate processes can feel distant from the realities young people are trying to change. Pre-COP engagement creates a bridge between those realities and the language of international negotiation.`, `In collaboration with the GoAdapt project, BTS delivered sessions focused on evidence, messaging and meaningful participation.`, `The work helped young advocates carry clearer priorities into wider climate discussions while remaining grounded in the communities they represent.`]},
reporters:{category:'Climate journalism',title:'Amplifying Climate Stories Across Borders',meta:'20 October 2023 · Ghana, Nigeria and Liberia',image:'assets/img/story-reporters.webp',alt:'Youth climate reporters collaborating',body:[`Climate reporting shapes what the public understands, what leaders prioritise and whose experiences are seen. Strong reporting needs both editorial skill and confidence with evidence.`, `BTS provided technical and editorial support to youth climate reporters in Ghana, Nigeria and Liberia, strengthening their ability to produce accurate, engaging stories across media formats.`, `Across borders, the principle remained the same: climate evidence becomes more powerful when people can recognise their own lives within the story.`]}
};
