const stories={
heat:{category:'Climate & society',title:'What Heat Stole From Us',meta:'June 2026 · Accra, Ghana',image:'assets/img/community.webp',alt:'BTS participants reviewing material outdoors',content:`
<p>The heat does not arrive as a headline. It enters bedrooms that no longer cool at night, classrooms where concentration becomes difficult, markets where food spoils faster and farms where familiar seasons begin to shift. Its effects gather quietly, in the extra water a household must buy, the hours of work lost to exhaustion and the care required when an older person or child becomes unwell.</p>
<blockquote>Climate risk becomes real through ordinary routines. To understand heat, we have to understand who can change those routines and who cannot.</blockquote>
<h2>Heat is an everyday systems issue</h2>
<p>Extreme heat is often described through temperature records, but the number alone is not the experience. The same hot day can mean different things for a person working outside, a trader under a metal roof, a pupil in a crowded classroom or a family living in a room with limited ventilation. Exposure is shaped by housing, work, transport, shade, water, energy and access to health services.</p>
<p>That makes heat more than a weather issue. It is a planning issue, a labour issue, a health issue and a question of how cities and communities are designed. When these systems are considered separately, the people living at their intersection can disappear from view.</p>
<h2>Who has room to adapt?</h2>
<p>Advice about heat can sound simple: rest, drink water, move into the shade, reduce activity during the hottest hours. Yet every recommendation assumes that a person has choices. A worker paid by the day may not be able to stop. A household facing unreliable power may not be able to cool a room. A market trader cannot move a livelihood indoors. Climate justice begins by recognising this uneven room to manoeuvre.</p>
<p>Good evidence therefore needs two kinds of attention. It must track physical conditions, and it must listen carefully to lived conditions. Community observations can reveal where heat settles, which services fail first and which coping strategies carry new costs. Scientific data can identify patterns and guide thresholds. Together, they provide a stronger basis for action than either can provide alone.</p>
<h2>What a practical response looks like</h2>
<p>There is no single intervention that makes a community heat-safe. The response is a portfolio: clearer public warnings; heat-aware school, health and workplace protocols; more shade and vegetation; buildings designed for airflow; reliable water access; and urban plans that reduce rather than trap heat. Public communication must also be specific. People need to know what a warning means for the next school day, work shift or journey—not only that temperatures will rise.</p>
<p>For Beyond the Science, the central question is what helps evidence travel. A climate dataset becomes useful when institutions can interpret it, journalists can explain it and communities can challenge or refine the picture it creates. Heat planning should be built with the people expected to live with the decisions.</p>
<h2>Changing what happens next</h2>
<p>The losses associated with heat are not always dramatic enough to become news. They accumulate in sleep, income, health, learning and time. That is precisely why they demand attention. Making those losses visible is not an exercise in alarm. It is the first step toward designing public systems that protect people before a dangerous day becomes a crisis.</p>
<aside class="article-sources"><h2>Further reading</h2><p><a href="https://www.who.int/news-room/fact-sheets/detail/climate-change-heat-and-health" target="_blank" rel="noopener noreferrer">World Health Organization: Climate change, heat and health</a></p></aside>`},
nature:{category:'Climate adaptation',title:'Building Youth Leadership on Nature-Based Solutions',meta:'18 April 2023 · Accra, Ghana',image:'assets/img/story-heat.webp',alt:'Young people discussing climate research',content:`
<p>Nature-based solutions are sometimes presented as a simple instruction: plant trees, restore wetlands, protect a coastline. The real work is more demanding. A durable intervention must respond to a specific ecosystem, support the people who depend on it and remain viable long after the launch photograph.</p>
<blockquote>Nature can be part of climate infrastructure, but only when ecological knowledge, local priorities and long-term stewardship are designed together.</blockquote>
<h2>From concept to local decision</h2>
<p>Young climate leaders encounter a crowded field of terms—adaptation, restoration, resilience, biodiversity and ecosystem services. Training becomes useful when those terms are connected to choices on the ground. What is changing in this place? Who uses the land or water? Which risks are most urgent? Who carries the work of maintenance? Who benefits, and who could be displaced?</p>
<p>BTS learning spaces use these questions to move beyond slogans. Participants examine how ecological action can reduce climate risk while also creating trade-offs. A mangrove restoration effort, for example, cannot be judged only by the number of seedlings planted. Survival, coastal protection, local livelihoods, access and community governance all matter.</p>
<h2>Leadership is more than technical knowledge</h2>
<p>Young practitioners need enough scientific grounding to assess an intervention, but they also need the confidence to convene people with different forms of expertise. Community elders may understand environmental change across decades. Farmers and fishers hold detailed knowledge of seasonal conditions. Researchers can test assumptions. Public institutions shape land-use decisions and resources.</p>
<p>The leader’s role is not to flatten these perspectives into easy agreement. It is to create a process in which evidence can be tested, priorities negotiated and responsibilities made clear. This requires facilitation, communication and partnership-building alongside technical skill.</p>
<h2>Guarding against easy promises</h2>
<p>Not every green activity is automatically just or effective. Fast-growing species may be poorly suited to a landscape. Conservation restrictions can limit access for people whose livelihoods depend on an area. Carbon claims can distract from biodiversity or community rights. Nature-based work needs safeguards, transparent decision-making and a willingness to change course when evidence shows that an approach is not working.</p>
<p>Monitoring should therefore begin before implementation. A credible plan establishes ecological and social baselines, identifies who will observe change and sets moments for review. Learning is not a final report; it is part of management.</p>
<h2>Building a generation of stewards</h2>
<p>Youth leadership matters because adaptation is long-term work. The people beginning their climate practice now will live with the consequences of today’s environmental choices. Giving them serious tools—and taking their analysis seriously—expands the group of people able to translate climate evidence into locally legitimate action.</p>
<p>The ambition is not simply to produce advocates for nature-based solutions. It is to support leaders who can distinguish a compelling idea from a credible one, connect policy to place and build the relationships that stewardship requires.</p>
<aside class="article-sources"><h2>Further reading</h2><p><a href="https://www.unep.org/topics/nature-action/nature-based-solutions" target="_blank" rel="noopener noreferrer">UN Environment Programme: Nature-based solutions</a></p></aside>`},
voices:{category:'Policy',title:'Strengthening Youth Voices in Climate Policy',meta:'7 May 2024 · Tamale, Ghana',image:'assets/img/story-policy.webp',alt:'Youth climate policy workshop',content:`
<p>Young people are frequently described as stakeholders in climate policy, yet an invitation to a meeting is not the same as influence. Participation becomes meaningful when young people can understand the process, bring evidence into it, frame proposals and see how their contribution affects a decision.</p>
<blockquote>Voice is not measured by who was in the room. It is measured by whether people could shape the question, the evidence and the outcome.</blockquote>
<h2>Participation must begin earlier</h2>
<p>Consultation often happens after the priorities, language and available choices have already been decided. By that stage, participants may only be asked to react. Stronger engagement brings youth and community perspectives into agenda-setting: defining the problem, identifying missing evidence and deciding what a fair response should consider.</p>
<p>This is especially important in climate policy because broad national commitments eventually become specific choices about land, finance, energy, livelihoods and public services. Those choices affect generations differently. Youth participation helps institutions see longer time horizons and understand how policy is experienced outside formal spaces.</p>
<h2>Evidence changes the quality of advocacy</h2>
<p>Passion opens attention; evidence helps sustain it. Capacity building should enable young advocates to read a policy document, interpret a climate claim, distinguish data from opinion and connect local experience to a recommendation. It should also make room for uncertainty. Credible advocacy does not pretend to know everything—it explains what is known, what remains contested and what action is justified now.</p>
<p>Storytelling is part of this practice. A statistic can establish scale, while a grounded account can show consequence. Used together, they help decision-makers understand both the public importance of an issue and the human reality behind it.</p>
<h2>Representation needs accountability</h2>
<p>No young person represents every youth constituency. Geography, gender, disability, livelihood, education and income shape climate experience. A strong representative process is explicit about whose knowledge is present and whose is missing. It creates ways for delegates to prepare with others before an engagement and report back afterwards.</p>
<p>This feedback loop matters. Without it, participation can become personal visibility rather than collective influence. With it, one seat at a table can connect to a wider network of experience and scrutiny.</p>
<h2>From invitation to institution</h2>
<p>The next step is to make youth participation routine rather than exceptional. Public institutions can publish clear engagement timelines, share accessible background material, support diverse participation and explain how submissions were considered. Youth organisations can strengthen their own evidence systems, policy literacy and succession planning.</p>
<p>Beyond the Science works at this bridge between knowledge and public action. The goal is not louder participation for its own sake. It is better climate policy—policy informed by people who will inherit its results and equipped to hold institutions to the promises they make.</p>
<aside class="article-sources"><h2>Further reading</h2><p><a href="https://unfccc.int/topics/education-youth/ace-hub/action-for-climate-empowerment-youth-exchange" target="_blank" rel="noopener noreferrer">UNFCCC: Action for Climate Empowerment Youth Exchange</a></p></aside>`},
mel:{category:'Innovation',title:'Co-Creating Youth MEL Systems',meta:'12 June 2024 · Legon, Accra',image:'assets/img/story-mel.webp',alt:'Participants co-creating a monitoring framework',content:`
<p>Monitoring, evaluation and learning systems are meant to help programmes understand change. Too often, they become reporting machinery: complex spreadsheets completed for someone else, long after the information could have improved a decision.</p>
<blockquote>A useful learning system does not merely prove that work happened. It helps a team notice what is changing and decide what to do next.</blockquote>
<h2>Start with the people who will use it</h2>
<p>Co-creation changes the first question. Instead of asking which indicators a template requires, it asks what programme teams, participants and partners need to learn. For youth climate initiatives, that might include whether participants gained confidence to engage institutions, whether collaborations continued after a workshop or whether an idea became a functioning local activity.</p>
<p>Bringing young climate actors into the design process makes the system more grounded. They can identify changes that formal frameworks overlook, language that feels unclear and data requests that would be unrealistic or unsafe. Researchers and institutional partners contribute methodological rigour. The strongest design uses both.</p>
<h2>Measure contribution, not fantasy</h2>
<p>Climate programmes operate in complex environments. A single workshop does not cause a policy change on its own; a campaign is rarely the only reason public attention shifts. A credible framework avoids claiming more than the evidence supports. It traces plausible contribution: the connections, capabilities, decisions and intermediate changes that a programme helped create.</p>
<p>This also makes learning more honest. If an expected change did not occur, the question is not simply whether a target was missed. Teams can examine the assumptions underneath the plan. Was the intended audience reached? Did participants have the authority or resources to act? Did the political or environmental context change?</p>
<h2>Use mixed evidence with purpose</h2>
<p>Numbers are valuable when they answer a real question. Participation counts, completion rates and audience reach can show scale. They cannot by themselves show the quality of a partnership or how someone applied new knowledge. Interviews, observation, reflective journals and outcome stories add depth. The aim is not to collect everything, but to combine evidence that supports a decision.</p>
<p>Ethics matters throughout. Participants should understand why information is being collected and how it will be used. Data should be proportionate, securely handled and attentive to power. A learning system loses its value if it extracts stories from people without giving them agency or benefit.</p>
<h2>Close the loop</h2>
<p>Learning only becomes real when it returns to practice. Short review cycles can help teams adjust delivery while a programme is active. Participant feedback can shape the next session. Partners can compare what they are seeing and revise a shared theory of change. Results can be communicated back to the people who contributed the data.</p>
<p>The co-creation approach used by BTS with academic and youth partners treats MEL as programme infrastructure, not an administrative afterthought. It creates a clearer route from activity to evidence, from evidence to reflection and from reflection to a better next decision.</p>
<aside class="article-sources"><h2>Further reading</h2><p><a href="https://www.betterevaluation.org/" target="_blank" rel="noopener noreferrer">BetterEvaluation: evaluation methods and approaches</a></p></aside>`},
grassroots:{category:'Youth',title:'Strengthening Grassroots Climate Action',meta:'25 July 2025 · Accra, Ghana',image:'assets/img/story-grassroots.webp',alt:'Climate activists taking part in group work',content:`
<p>Grassroots climate leaders rarely begin with a blank page. They begin with lived evidence: a water source that has changed, crops that no longer follow familiar timing, a neighbourhood that floods, a livelihood under pressure. Their ideas grow from proximity to the problem and from relationships that outside organisations cannot quickly reproduce.</p>
<blockquote>Locally rooted action is not a smaller version of expert climate work. It is expertise—different in form, essential in practice.</blockquote>
<h2>The gap is often structural</h2>
<p>Many community initiatives have energy, legitimacy and a clear understanding of need. What they lack may be flexible finance, technical accompaniment, safeguarding systems, communications support or the time required to navigate institutional processes. Traditional funding can deepen this gap by demanding complex proposals and rapid results before an organisation has the capacity to produce them.</p>
<p>Support is more effective when it begins with the initiative as it exists. What is already working? Which relationships make it possible? What risk would growth introduce? Not every project needs to scale nationally. Some need to deepen locally, strengthen governance or become more financially stable.</p>
<h2>Turn an idea into a delivery pathway</h2>
<p>Programme design gives a promising idea a testable structure. A team clarifies the change it wants to support, the people who should shape the work, the activities most likely to help and the assumptions connecting them. It identifies practical requirements—budget, permissions, partnerships, skills and time—and creates moments to review progress.</p>
<p>This discipline does not make community action less creative. It protects the core idea by making constraints visible early. It also helps grassroots leaders communicate with funders and institutions without surrendering the local purpose of the work.</p>
<h2>Power belongs in the design</h2>
<p>Locally led adaptation is not simply delivery that happens in a community. It requires decision-making power, transparency and accountability to the people most affected. Communities should be able to set priorities, challenge assumptions and understand how resources are allocated. External partners should be clear about what they control and what they are willing to transfer.</p>
<p>Inclusion must be deliberate. Public meetings do not automatically represent everyone. Timing, language, accessibility and social norms affect who can speak. A credible process looks for the people least likely to be heard and adapts the method so their knowledge can shape the work.</p>
<h2>Sustainability is more than continued funding</h2>
<p>A sustainable initiative may build local skills, create a partnership with a public service, generate a modest revenue stream, influence a policy or establish practices that continue without a project office. The right pathway depends on the purpose. Planning for continuity should begin early, while there is still room to change the model.</p>
<p>BTS supports climate activists to strengthen this connection between local insight and durable action. The aim is not to professionalise away what makes grassroots leadership valuable. It is to add the structure, evidence and institutional access that allow locally rooted ideas to travel further and last longer.</p>
<aside class="article-sources"><h2>Further reading</h2><p><a href="https://www.iied.org/principles-locally-led-adaptation" target="_blank" rel="noopener noreferrer">IIED: Principles for locally led adaptation</a></p></aside>`},
cop:{category:'Youth',title:'Preparing Youth Voices for Global Climate Dialogue',meta:'3 September 2025 · Accra, Ghana',image:'assets/img/story-cop.webp',alt:'Young climate advocates in a pre-COP session',content:`
<p>A global climate conference compresses years of negotiation, technical language and competing national interests into a few crowded weeks. For a young advocate, simply entering that environment is not enough. Preparation determines whether presence can become influence.</p>
<blockquote>The strongest global message begins locally: with a clear constituency, credible evidence and an honest account of what people need.</blockquote>
<h2>Understand the room before entering it</h2>
<p>Climate negotiations have formal tracks, procedural rules and specialised vocabulary. Pre-COP learning helps advocates identify where their priorities sit, which actors have decision-making power and what kind of intervention is possible. It distinguishes a public campaign message from a policy proposal and a networking opportunity from a negotiation moment.</p>
<p>This orientation reduces the pressure to comment on everything. An advocate can choose a focused issue, understand the relevant national and regional positions and prepare evidence that supports a specific request.</p>
<h2>Build a message that can travel</h2>
<p>A useful advocacy message connects three elements: lived reality, supporting evidence and a clear action. If one is missing, the message can become either abstract or difficult to act upon. Preparation sessions give young people space to test their framing, anticipate questions and adapt the same core argument for a delegate, journalist, civil society partner or public audience.</p>
<p>Evidence should be selected carefully. A small number of reliable facts, interpreted accurately, is more persuasive than a crowded presentation. Local accounts add meaning, but they must be shared with consent and without turning people’s hardship into decoration.</p>
<h2>Representation begins before the flight</h2>
<p>Delegates need a relationship with the people they claim to represent. That means consulting networks before the conference, agreeing priorities and establishing how updates will flow during the event. It also means being transparent about access: which rooms are open, which are restricted and where influence is realistically possible.</p>
<p>After the conference, accountability continues. A useful debrief explains what happened, what did not, which relationships were built and what follow-up is required. Without that return journey, international participation can become disconnected from the movements and communities that gave it purpose.</p>
<h2>Success is not a photograph</h2>
<p>Meaningful participation may produce a changed text, a new institutional commitment, a collaboration, stronger national advocacy or a better-informed public conversation. Some results take time. A preparation process should define success broadly enough to recognise these pathways while remaining specific enough to learn from them.</p>
<p>BTS pre-COP engagement focuses on evidence, messaging and participation grounded in place. The objective is not to teach young people to imitate established institutions. It is to equip them to enter global dialogue with their own analysis intact—and with a practical plan for turning international access into action at home.</p>
<aside class="article-sources"><h2>Further reading</h2><p><a href="https://www.iied.org/17385iied" target="_blank" rel="noopener noreferrer">IIED: Climate negotiations terminology for new delegates</a></p></aside>`},
reporters:{category:'Climate journalism',title:'Amplifying Climate Stories Across Borders',meta:'20 October 2023 · Ghana, Nigeria and Liberia',image:'assets/img/story-reporters.webp',alt:'Youth climate reporters collaborating',content:`
<p>Climate change is not a single reporting beat. It runs through health, agriculture, business, energy, migration, education and culture. The journalist’s task is to make those connections visible without losing accuracy—or the people whose lives give the story meaning.</p>
<blockquote>Evidence earns trust when it is verified and explained. Story earns attention when audiences can recognise why that evidence matters.</blockquote>
<h2>Begin with a precise question</h2>
<p>“Climate change is affecting communities” is true but too broad to guide strong reporting. A sharper story asks what is changing, where, for whom and through which mechanism. It might examine how heat affects a particular kind of work, how changing rainfall alters a crop decision or how a public adaptation commitment is being implemented.</p>
<p>A precise question helps a reporter identify the evidence needed and the people who can test it. It also prevents climate language from being added to a story without demonstrating the connection.</p>
<h2>Build an evidence chain</h2>
<p>Climate reporting must distinguish observation, attribution and projection. A person can reliably describe what they experienced. A dataset can show a pattern. A specialist can explain how confidently that pattern is connected to wider climatic change. These sources perform different roles; none should be made to claim what it cannot establish.</p>
<p>Verification includes checking the origin and date of data, reading beyond a press release, asking researchers about limitations and seeking more than one informed perspective. When uncertainty exists, clear language strengthens rather than weakens the story. Audiences should know what is established, what is likely and what remains unknown.</p>
<h2>Keep people as agents</h2>
<p>Communities affected by climate risk are not only victims. They analyse conditions, adapt livelihoods, organise resources and challenge institutions. Reporting becomes richer when it shows this agency without romanticising coping strategies or shifting responsibility away from systems with greater power.</p>
<p>Ethical practice also means informed consent, care with images and attention to what publication could expose. A compelling anecdote does not justify harm. Reporters should explain how a contribution will be used and avoid promising outcomes the story cannot deliver.</p>
<h2>Cross-border learning without flattening place</h2>
<p>Work with youth reporters across Ghana, Nigeria and Liberia creates opportunities to compare patterns, editorial approaches and public language. Shared regional challenges can reveal the scale of an issue. Yet each story must remain specific. A coastal risk, policy system or livelihood cannot be assumed to operate the same way across countries—or even across districts.</p>
<p>Editorial exchange is most valuable when reporters challenge one another’s assumptions, share trusted sources and learn how different audiences understand climate language. The result is not one uniform African climate story, but a stronger network of locally grounded reporting.</p>
<h2>Journalism as public infrastructure</h2>
<p>Good climate reporting helps people make decisions. It can explain a warning, scrutinise public spending, reveal an overlooked risk and bring community knowledge into national debate. This public value depends on editorial independence, evidence literacy and consistent investment in reporters—not only during disasters or global summits.</p>
<p>BTS supports the space between research and story: where technical knowledge is interrogated, translated and connected to public life. Across formats and borders, the standard remains the same—accurate enough to trust, clear enough to use and human enough to remember.</p>
<aside class="article-sources"><h2>Further reading</h2><p><a href="https://www.unesco.org/en/reporting-environment-resources-journalists" target="_blank" rel="noopener noreferrer">UNESCO: Reporting on the environment—resources for journalists</a></p></aside>`}
